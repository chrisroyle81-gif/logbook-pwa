<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e0e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<title>Logbook</title>
<style>
  :root {
    --bg:          #0e0e0c;
    --bg-lift:     #121210;
    --ink:         #e8e4d8;
    --ink-dim:     #a8a294;
    --muted:       #7e786c;
    --line:        #26241f;
    --line-lit:    #3b372e;
    --accent:      #d9954a;
    --accent-soft: rgba(217,149,74,0.13);
    --accent-dim:  #8a5e2c;
    --bad:         #c66060;
    --good:        #7aa565;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Roboto Mono', Consolas, monospace;
    --tight: 0.16em;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    height: 100%; height: 100dvh;
    background: var(--bg); color: var(--ink);
    font-family: var(--mono);
    font-size: 16px; line-height: 1.5;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
    /* Hairline of warmth at the very top - reads as a lit edge, not a border. */
    background-image: linear-gradient(180deg, rgba(217,149,74,0.055), transparent 220px);
  }

  /* header */
  header {
    padding: 16px 20px 13px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .brand {
    font-weight: 600; letter-spacing: var(--tight);
    text-transform: uppercase; font-size: 13px;
    display: inline-flex; align-items: center; gap: 9px;
  }
  .brand .mark {
    color: var(--accent); font-size: 15px; line-height: 1;
    transform: translateY(-0.5px);
  }
  .settings-link {
    color: var(--muted); font-size: 10.5px; text-decoration: none;
    letter-spacing: 0.13em; text-transform: uppercase;
    padding: 7px 10px; margin: -7px -10px;
    border-radius: 3px; transition: color 0.18s;
  }
  .settings-link:active { color: var(--accent); }

  /* main */
  main {
    flex: 1; min-height: 0;
    padding: 14px 20px 16px;
    display: flex; flex-direction: column;
  }
  .capture, .settings { flex: 1; min-height: 0; flex-direction: column; }
  .capture { display: flex; gap: 11px; }
  .capture.hidden { display: none; }
  .settings { display: none; gap: 15px; overflow-y: auto; }
  .settings.active { display: flex; }

  /* meta strip */
  .field-meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 10.5px; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
    flex-shrink: 0; min-height: 14px;
  }
  .field-meta span.item { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
  .field-meta .loc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field-meta .spacer { flex: 1; }
  .field-meta .time { color: var(--ink-dim); letter-spacing: 0.12em; flex-shrink: 0; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .dot.live { background: var(--accent); animation: pulse 1.4s infinite; }
  .dot.ok   { background: var(--good); }
  .dot.err  { background: var(--bad); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.35; transform: scale(1.45); }
  }

  /* textarea */
  .composer { position: relative; flex: 1; min-height: 120px; display: flex; }
  textarea {
    flex: 1; width: 100%;
    background: var(--bg-lift); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 15px 15px 34px;
    font: inherit; font-size: 17px; line-height: 1.6;
    resize: none; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  textarea::placeholder { color: #5d584e; }
  textarea:focus {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 1px var(--accent-soft), inset 0 0 34px rgba(217,149,74,0.035);
  }
  /* Count sits inside the box, bottom-right - present but never in the way. */
  .count {
    position: absolute; right: 12px; bottom: 10px;
    font-size: 10px; letter-spacing: 0.1em; color: #57524a;
    pointer-events: none; transition: color 0.2s;
  }
  .count.big { color: var(--accent); }

  /* status line */
  .statusline {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px; color: var(--muted);
    letter-spacing: 0.09em; text-transform: uppercase;
    flex-shrink: 0; min-height: 14px;
  }
  .statusline.has { color: var(--accent); }

  /* actions */
  .actions { display: flex; gap: 9px; flex-shrink: 0; align-items: stretch; }
  button {
    font: inherit; font-size: 13px;
    letter-spacing: 0.13em; text-transform: uppercase;
    background: transparent; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 15px 14px; cursor: pointer;
    transition: border-color 0.18s, color 0.18s, background 0.18s, opacity 0.18s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.42; }
  /* Clear is deliberately quiet: it is destructive and sits beside Save. */
  .btn-ghost { flex: 0 0 auto; min-width: 86px; color: var(--muted); }
  .btn-ghost:active { border-color: var(--line-lit); color: var(--ink-dim); }
  .btn-primary {
    position: relative; overflow: hidden;
    flex: 1;
    background: var(--accent); color: #17150f;
    border-color: var(--accent); font-weight: 600;
  }
  .btn-primary:disabled {
    background: var(--accent-dim); border-color: var(--accent-dim);
    color: #1c1810; opacity: 1;
  }
  .btn-primary .bar {
    position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
    background: rgba(20,17,10,0.42);
    transform: scaleX(0); transform-origin: left center;
  }
  .btn-primary.sending .bar { animation: creep 14s cubic-bezier(.1,.85,.25,1) forwards; }
  @keyframes creep { to { transform: scaleX(0.97); } }
  .btn-danger { border-color: rgba(198,96,96,0.45); color: var(--bad); }

  /* toast */
  .toast {
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    right: max(16px, env(safe-area-inset-right));
    /* Clears the action row instead of covering the Save button. */
    bottom: calc(84px + env(safe-area-inset-bottom));
    background: #131310; border: 1px solid var(--line);
    border-left: 2px solid var(--good); border-radius: 4px;
    padding: 13px 15px; font-size: 12.5px; letter-spacing: 0.04em;
    color: var(--ink);
    box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    opacity: 0; transform: translateY(14px);
    transition: opacity 0.24s, transform 0.24s;
    pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err  { border-left-color: var(--bad); }
  .toast.warn { border-left-color: var(--accent); }

  /* settings */
  .settings label {
    display: flex; flex-direction: column; gap: 7px; font-size: 10.5px;
    color: var(--muted); letter-spacing: 0.13em; text-transform: uppercase;
  }
  .settings input {
    background: var(--bg-lift); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 13px; font: inherit; font-size: 14px; outline: none;
    letter-spacing: 0; text-transform: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .settings input:focus {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 1px var(--accent-soft);
  }
  .settings .hint {
    font-size: 11.5px; color: var(--muted); line-height: 1.65;
    text-transform: none; letter-spacing: 0; margin: 0;
  }
  .settings .rule { height: 1px; background: var(--line); margin: 2px 0; }
  .settings .queue-line {
    font-size: 10.5px; color: var(--muted);
    letter-spacing: 0.09em; text-transform: uppercase;
  }
  .settings .queue-line.has { color: var(--accent); }
  .settings .push { flex: 1; min-height: 8px; }
  /* Sits directly under the queue count it acts on, rather than competing with
     Back and Save for room in the footer row. */
  .btn-block { width: 100%; padding: 13px 14px; font-size: 12px; }
  .settings .actions button { flex: 1; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark">&#8889;</span>Logbook</div>
  <a href="#" class="settings-link" id="settingsBtn">Setup</a>
</header>

<main>
  <section class="capture" id="capture">
    <div class="field-meta">
      <span class="item"><span class="dot ok" id="locDot"></span><span class="loc" id="locLabel">locating&hellip;</span></span>
      <span class="spacer"></span>
      <span class="item time" id="timeLabel"></span>
    </div>

    <div class="composer">
      <textarea id="typeInput" placeholder="&hellip;" autofocus
                enterkeyhint="enter" autocapitalize="sentences"
                autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
      <div class="count" id="count"></div>
    </div>

    <div class="statusline" id="queueStatus"></div>

    <div class="actions">
      <button id="btnClear" class="btn-ghost">Clear</button>
      <button id="btnSubmit" class="btn-primary"><span id="btnSubmitLabel">Save</span><span class="bar"></span></button>
    </div>
  </section>

  <section class="settings" id="settings">
    <label>
      Apps Script Web App URL
      <input type="url" id="cfgUrl" inputmode="url" autocomplete="off"
             autocapitalize="off" spellcheck="false"
             placeholder="https://script.google.com/macros/s/&hellip;/exec">
    </label>
    <label>
      Shared Token
      <input type="text" id="cfgToken" autocomplete="off"
             autocapitalize="off" spellcheck="false"
             placeholder="(matches SHARED_TOKEN in Code.gs)">
    </label>
    <p class="hint">Both values must match what&rsquo;s in your Apps Script. Stored locally in this browser only &mdash; never sent anywhere except your endpoint.</p>
    <div class="rule"></div>
    <div class="queue-line" id="cfgQueueLine"></div>
    <p class="hint">Queued entries retry automatically whenever you save or come back online. Clearing the queue discards them permanently.</p>
    <button id="cfgClearQueue" class="btn-danger btn-block">Clear queue</button>
    <div class="push"></div>
    <div class="actions">
      <button id="cfgCancel" class="btn-ghost">Back</button>
      <button id="cfgSave" class="btn-primary">Save</button>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---------- CONFIG ----------
var LS_URL   = 'logbook.url';
var LS_TOKEN = 'logbook.token';
var LS_QUEUE = 'logbook.queue';

// Entries longer than this get a visual heads-up: they take the Apps Script
// noticeably longer to append, which is exactly when a send is most likely to
// outlive the connection. The id-based dedupe below makes that safe, but the
// user should still know why the button is sitting on "Sending".
var BIG_ENTRY = 3000;

// ---------- ELEMENTS ----------
function $(id) { return document.getElementById(id); }
var capture = $('capture'), settings = $('settings');
var typeInput = $('typeInput');
var locDot = $('locDot'), locLabel = $('locLabel');
var timeLabel = $('timeLabel'), toast = $('toast');
var queueStatus = $('queueStatus');
var btnSubmit = $('btnSubmit'), btnSubmitLabel = $('btnSubmitLabel');
var countEl = $('count');

// ---------- STATE ----------
var coords = null;
var flushing = false;   // re-entrancy guard - see flushQueue()

// ---------- IDS ----------
// One id per entry, minted at compose time and preserved across every retry.
// The server keeps a short memory of ids it has already written, so a reply
// lost in transit can be retried without the entry landing in the doc twice.
function newId() {
  try {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  } catch (e) { /* fall through */ }
  return 'x' + Date.now().toString(36) + '-' +
         Math.random().toString(36).slice(2, 10) +
         Math.random().toString(36).slice(2, 10);
}

// ---------- CAPTURE STATE ----------
function refreshLocation() {
  locLabel.textContent = 'locating…';
  locDot.className = 'dot live';
  coords = null;
  if (!navigator.geolocation) {
    locLabel.textContent = 'unsupported';
    locDot.className = 'dot err';
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function (pos) {
      coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      locLabel.textContent = coords.lat.toFixed(4) + ', ' + coords.lng.toFixed(4);
      locDot.className = 'dot ok';
    },
    function () { locLabel.textContent = 'no location'; locDot.className = 'dot err'; },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
  );
}

function refreshTimeDisplay() {
  timeLabel.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function updateCount() {
  var n = typeInput.value.length;
  countEl.textContent = n ? String(n) : '';
  countEl.classList.toggle('big', n >= BIG_ENTRY);
}

function resetCapture() {
  refreshTimeDisplay();
  typeInput.value = '';
  updateCount();
  refreshLocation();
  updateQueueStatus();
  setTimeout(function () { typeInput.focus(); }, 50);
}

function showCapture() {
  capture.classList.remove('hidden');
  settings.classList.remove('active');
  resetCapture();
}
function showSettings() {
  capture.classList.add('hidden');
  settings.classList.add('active');
  $('cfgUrl').value = localStorage.getItem(LS_URL) || '';
  $('cfgToken').value = localStorage.getItem(LS_TOKEN) || '';
  updateCfgQueueLine();
}

function setSending(on) {
  btnSubmit.disabled = on;
  btnSubmit.classList.toggle('sending', on);
  btnSubmitLabel.textContent = on ? 'Sending' : 'Save';
}

// ---------- SUBMIT ----------
// Outbox pattern: the entry is written to the durable queue BEFORE any network
// call, and only ever removed once the server has confirmed it. The old flow
// (send first, queue on failure) could not tell "never arrived" apart from
// "arrived, was written, reply lost" - and retried both, which is how a slow
// large entry ended up in the doc twice.
function submit() {
  var content = typeInput.value.trim();
  if (!content) { showToast('Nothing to save', 'err'); return; }

  var url = localStorage.getItem(LS_URL);
  var token = localStorage.getItem(LS_TOKEN);
  if (!url || !token) { showToast('Set URL and token in Setup', 'err'); showSettings(); return; }

  // Timestamp captured at SAVE time, not open time. If the app sat in the
  // background for hours we want the moment the user actually finished.
  var payload = {
    id: newId(),
    ts: new Date().toISOString(),
    lat: coords ? coords.lat : null,
    lng: coords ? coords.lng : null,
    content: content,
    mode: 'type'
  };

  enqueue(payload);          // durable first - a crash here loses nothing
  typeInput.value = '';      // safe to clear: it is in the queue
  updateCount();
  updateQueueStatus();

  setSending(true);
  return flushQueue({ silent: true }).then(function (res) {
    setSending(false);
    if (res.sent > 0 && res.remaining === 0) {
      showToast(res.dupes ? 'Saved (already had it)' : 'Saved', 'good');
    } else if (res.remaining > 0) {
      showToast(res.lastError === 'auth'
        ? 'Rejected — check token in Setup'
        : 'Offline — queued, will retry', 'warn');
    }
    resetCapture();
  });
}

// Resolves to { ok, duplicate, error, fatal } - never throws.
function sendPayload(payload) {
  var url = localStorage.getItem(LS_URL);
  var token = localStorage.getItem(LS_TOKEN);
  if (!url || !token) return Promise.resolve({ ok: false, error: 'unconfigured' });

  var body = {};
  for (var k in payload) if (Object.prototype.hasOwnProperty.call(payload, k)) body[k] = payload[k];
  body.token = token;

  return fetch(url, {
    method: 'POST',
    // text/plain dodges the CORS preflight that Apps Script cannot answer.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function (res) {
    if (!res.ok) return { ok: false, error: 'http' };
    return res.json().catch(function () { return {}; }).then(function (data) {
      if (data.ok === false) {
        // Refused. Report WHY so the toast can point at Setup, but never treat
        // it as final: a wrong token is a fixable mistake, and discarding the
        // entry would throw away writing the user cannot get back. Entries only
        // ever leave the queue on a confirmed write, or via Clear queue.
        var auth = /token/i.test(String(data.error || ''));
        return { ok: false, error: auth ? 'auth' : 'server' };
      }
      return { ok: true, duplicate: !!data.duplicate };
    });
  }).catch(function () {
    return { ok: false, error: 'network' };
  });
}

// ---------- QUEUE ----------
function loadQueue() {
  try { return JSON.parse(localStorage.getItem(LS_QUEUE) || '[]'); } catch (e) { return []; }
}
function saveQueue(q) {
  try { localStorage.setItem(LS_QUEUE, JSON.stringify(q)); } catch (e) { /* quota */ }
}
function enqueue(p) { var q = loadQueue(); q.push(p); saveQueue(q); }

// Guarded against overlapping runs. Previously `online`, page load and a
// post-save flush could all be in the loop at once: each took its own snapshot
// of the queue, each sent every item, and the last writer hid the evidence.
function flushQueue(opts) {
  opts = opts || {};
  if (flushing) {
    return Promise.resolve({ sent: 0, remaining: loadQueue().length, dupes: 0, skipped: true });
  }
  flushing = true;

  var batch = loadQueue();
  if (!batch.length) {
    flushing = false;
    return Promise.resolve({ sent: 0, remaining: 0, dupes: 0 });
  }

  var doneIds = Object.create(null);
  var sent = 0, dupes = 0, lastError = null;
  var i = 0;

  function step() {
    if (i >= batch.length) return Promise.resolve();
    var p = batch[i++];
    return sendPayload(p).then(function (r) {
      if (r.ok) {
        doneIds[p.id] = true;
        sent++;
        if (r.duplicate) dupes++;
      } else {
        lastError = r.error;
        // Nothing transient will fix itself within this batch - stop early
        // rather than replaying the same failure against every entry.
        if (r.error === 'network' || r.error === 'unconfigured' || r.error === 'auth') return;
      }
      return step();
    });
  }

  return step().then(function () {
    // Re-read rather than writing back the snapshot: an entry saved while this
    // loop was awaiting must not be erased.
    var remaining = loadQueue().filter(function (p) { return !doneIds[p.id]; });
    saveQueue(remaining);
    updateQueueStatus();
    updateCfgQueueLine();
    if (sent && !opts.silent) showToast('Sent ' + sent + ' queued', 'good');
    return { sent: sent, remaining: remaining.length, dupes: dupes, lastError: lastError };
  }).finally(function () {
    flushing = false;
  });
}

function updateQueueStatus() {
  var n = loadQueue().length;
  if (n) {
    queueStatus.textContent = n + ' entr' + (n === 1 ? 'y' : 'ies') + ' queued — will retry on send';
    queueStatus.classList.add('has');
  } else {
    queueStatus.textContent = '';
    queueStatus.classList.remove('has');
  }
}
function updateCfgQueueLine() {
  var n = loadQueue().length;
  var el = $('cfgQueueLine');
  if (!el) return;
  if (n) {
    el.textContent = n + ' entr' + (n === 1 ? 'y' : 'ies') + ' currently queued';
    el.classList.add('has');
  } else {
    el.textContent = 'No queued entries';
    el.classList.remove('has');
  }
}

// ---------- TOAST ----------
var toastTimer = null;
function showToast(msg, kind) {
  toast.textContent = msg;
  toast.classList.remove('err', 'warn');
  if (kind === 'err') toast.classList.add('err');
  if (kind === 'warn') toast.classList.add('warn');
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
}

// ---------- WIRE UP ----------
typeInput.addEventListener('input', updateCount);

$('btnClear').addEventListener('click', function () {
  if (typeInput.value.length >= BIG_ENTRY) {
    if (!confirm('Discard this entry? It has not been saved.')) return;
  }
  typeInput.value = '';
  updateCount();
  typeInput.focus();
});
btnSubmit.addEventListener('click', submit);
$('settingsBtn').addEventListener('click', function (e) { e.preventDefault(); showSettings(); });
$('cfgCancel').addEventListener('click', showCapture);
$('cfgSave').addEventListener('click', function () {
  localStorage.setItem(LS_URL, $('cfgUrl').value.trim());
  localStorage.setItem(LS_TOKEN, $('cfgToken').value.trim());
  showToast('Settings saved', 'good');
  showCapture();
  flushQueue();
});
$('cfgClearQueue').addEventListener('click', function () {
  var n = loadQueue().length;
  if (!n) { showToast('Queue is empty'); return; }
  if (confirm('Discard ' + n + ' entr' + (n === 1 ? 'y' : 'ies') + '? They will NOT be sent.')) {
    saveQueue([]);
    updateCfgQueueLine();
    updateQueueStatus();
    showToast('Queue cleared', 'warn');
  }
});

window.addEventListener('load', function () {
  if (!localStorage.getItem(LS_URL) || !localStorage.getItem(LS_TOKEN)) {
    showSettings();
  } else {
    showCapture();
    flushQueue();
  }
});
window.addEventListener('online', function () { flushQueue(); });

// When the PWA comes back to the foreground, refresh the time display and
// re-fetch location so the meta line reflects "now", and retry anything queued.
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  if (capture.classList.contains('hidden')) return;
  refreshTimeDisplay();
  refreshLocation();
  flushQueue();
});

// Keep the displayed time current if the app just sits open. The saved
// timestamp is captured at submit time regardless; this is only cosmetic.
setInterval(function () {
  if (!document.hidden && !capture.classList.contains('hidden')) refreshTimeDisplay();
}, 60000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
